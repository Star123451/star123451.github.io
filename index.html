<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Stats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h1>System Stats</h1>
    <p>Current Time: <span id="time"></span></p>
    <p>Browser: <span id="browser"></span></p>
    <p>Operating System: <span id="os"></span></p>
    <p>Screen Size: <span id="screen"></span></p>
    <p>Window Size: <span id="window"></span></p>
    <p>Status: <span id="online"></span></p>
    <p>Language: <span id="language"></span></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
